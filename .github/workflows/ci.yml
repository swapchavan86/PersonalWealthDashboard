name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore PersonalWealth.sln
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          dotnet build PersonalWealth.sln --no-restore --configuration Release 2>&1 | tee dotnet-build.log
      - name: Upload .NET build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-build-log
          path: dotnet-build.log
          if-no-files-found: error
      - name: Test
        run: dotnet test PersonalWealth.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

  angular:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/PersonalWealth.Web
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
