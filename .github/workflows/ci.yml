name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  dotnet:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore PersonalWealth.sln
      - name: Wait for SQL Server
        shell: bash
        run: |
          for i in {1..60}; do
            if docker exec "${{ job.services.mssql.id }}" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q 'SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server did not become ready in time."
          exit 1
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          dotnet build PersonalWealth.sln --no-restore --configuration Release 2>&1 | tee dotnet-build.log
      - name: Generate and commit EF snapshot sync
        shell: bash
        env:
          ConnectionStrings__Default: "Server=localhost,1433;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;Encrypt=False;"
        run: |
          set -euo pipefail
          dotnet tool install --global dotnet-ef --version 10.0.12
          export PATH="$HOME/.dotnet/tools:$PATH"
          rm -rf /tmp/ef-snapshot-candidate
          mkdir -p /tmp/ef-snapshot-candidate
          dotnet-ef migrations add SnapshotSyncCandidate \
            --project src/PersonalWealth.Infrastructure/PersonalWealth.Infrastructure.csproj \
            --startup-project src/PersonalWealth.Api/PersonalWealth.Api.csproj \
            --context PersonalWealthDbContext
          cp src/PersonalWealth.Infrastructure/Persistence/Migrations/*SnapshotSyncCandidate.cs /tmp/ef-snapshot-candidate/migration.cs
          cp src/PersonalWealth.Infrastructure/Persistence/Migrations/*SnapshotSyncCandidate.Designer.cs /tmp/ef-snapshot-candidate/designer.cs
          cp src/PersonalWealth.Infrastructure/Persistence/Migrations/PersonalWealthDbContextModelSnapshot.cs /tmp/ef-snapshot-candidate/PersonalWealthDbContextModelSnapshot.cs

          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/ef-snapshot-candidate/migration.cs')
          text = p.read_text(encoding='utf-8-sig')
          up = text.index('        protected override void Up(MigrationBuilder migrationBuilder)')
          down = text.index('        protected override void Down(MigrationBuilder migrationBuilder)')
          end = text.rindex('\n    }\n}')
          text = text[:up] + '''        protected override void Up(MigrationBuilder migrationBuilder)\n        {\n        }\n\n        /// <inheritdoc />\n        protected override void Down(MigrationBuilder migrationBuilder)\n        {\n        }\n''' + text[end:]
          p.write_text(text, encoding='utf-8')
          PY

          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"

          migration_id=$(basename /tmp/ef-snapshot-candidate/migration.cs .cs)
          designer_id="${migration_id}.Designer.cs"
          cp /tmp/ef-snapshot-candidate/migration.cs "src/PersonalWealth.Infrastructure/Persistence/Migrations/${migration_id}.cs"
          cp /tmp/ef-snapshot-candidate/designer.cs "src/PersonalWealth.Infrastructure/Persistence/Migrations/${designer_id}"
          cp /tmp/ef-snapshot-candidate/PersonalWealthDbContextModelSnapshot.cs src/PersonalWealth.Infrastructure/Persistence/Migrations/PersonalWealthDbContextModelSnapshot.cs

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PersonalWealth.Infrastructure/Persistence/Migrations
          if ! git diff --cached --quiet; then
            git commit -m "Sync EF migration model snapshot"
            git push origin "HEAD:$GITHUB_HEAD_REF"
          fi
      - name: Validate EF migrations against SQL Server
        shell: bash
        env:
          ConnectionStrings__Default: "Server=localhost,1433;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;Encrypt=False;"
        run: |
          set -o pipefail
          dotnet-ef database update \
            --project src/PersonalWealth.Infrastructure/PersonalWealth.Infrastructure.csproj \
            --startup-project src/PersonalWealth.Api/PersonalWealth.Api.csproj \
            --context PersonalWealthDbContext 2>&1 | tee ef-database-update.log
      - name: Upload EF migration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ef-database-update-log
          path: ef-database-update.log
          if-no-files-found: error
      - name: Upload .NET build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-build-log
          path: dotnet-build.log
          if-no-files-found: error
      - name: Test
        shell: bash
        env:
          PW_TEST_CONNECTION_STRING: "Server=localhost,1433;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;Encrypt=False;"
        run: |
          set -o pipefail
          dotnet test PersonalWealth.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" 2>&1 | tee dotnet-test.log
      - name: Upload .NET test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-log
          path: dotnet-test.log
          if-no-files-found: error

  angular:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/PersonalWealth.Web
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
